# ローカル開発用のサービス。本番（AWS）では RDS・S3・SES に置き換わる。
# 値はローカル専用の固定値なので、本番の設定には使わないこと。
name: timeline-sns

services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: timeline
      POSTGRES_USER: timeline
      POSTGRES_PASSWORD: timeline
    # ホスト側は 5433。別プロジェクトの PostgreSQL（5432）と同時に起動できるようにするため
    ports:
      - "5433:5432"
    volumes:
      # PostgreSQL 18 のイメージはデータを /var/lib/postgresql/18/docker に置くため、親ディレクトリをマウントする
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U timeline -d timeline"]
      interval: 5s
      timeout: 5s
      retries: 10

  # 画像の保存先（S3 互換）。エンドポイントは http://localhost:9090、認証情報は何でも通る。
  # MinIO のイメージが配布されなくなったため Adobe S3Mock を使う（#40）。バケットは起動時に作る
  s3mock:
    image: adobe/s3mock:5.2
    environment:
      COM_ADOBE_TESTING_S3MOCK_STORE_INITIAL_BUCKETS: timeline-media
      # 名前付きボリュームに保存し、コンテナを作り直しても画像を残す。
      # イメージが非 root ユーザーで動くため、保存先は書き込み権限のある /s3mockroot にする
      COM_ADOBE_TESTING_S3MOCK_STORE_ROOT: /s3mockroot
      COM_ADOBE_TESTING_S3MOCK_STORE_RETAIN_FILES_ON_EXIT: "true"
    ports:
      - "9090:9090"
    volumes:
      - s3mock-data:/s3mockroot

  # 送信メールの確認用。受信箱は http://localhost:8025、SMTP は localhost:1025
  mailpit:
    image: axllent/mailpit
    ports:
      - "1025:1025"
      - "8025:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
  s3mock-data:
