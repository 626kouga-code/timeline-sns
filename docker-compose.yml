# ローカル開発用のサービス。本番（AWS）では RDS・S3・SES に置き換わる。
# 値はローカル専用の固定値なので、本番の設定には使わないこと。
name: timeline-sns

services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: timeline
      POSTGRES_USER: timeline
      POSTGRES_PASSWORD: timeline
    # ホスト側は 5433。別プロジェクトの PostgreSQL（5432）と同時に起動できるようにするため
    ports:
      - "5433:5432"
    volumes:
      # PostgreSQL 18 のイメージはデータを /var/lib/postgresql/18/docker に置くため、親ディレクトリをマウントする
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U timeline -d timeline"]
      interval: 5s
      timeout: 5s
      retries: 10

  # 画像の保存先（S3 互換）。エンドポイントは http://localhost:9090、認証情報は何でも通る。
  # MinIO のイメージが配布されなくなったため Adobe S3Mock を使う（#40）。バケットは起動時に作る
  s3mock:
    image: adobe/s3mock:5.2
    environment:
      # timeline-e2e は E2E テスト用（開発用の画像と混ざらないように分ける。docs/08）
      COM_ADOBE_TESTING_S3MOCK_STORE_INITIAL_BUCKETS: timeline-media,timeline-e2e
      # 名前付きボリュームに保存し、コンテナを作り直しても画像を残す。
      # イメージが非 root ユーザーで動くため、保存先は書き込み権限のある /s3mockroot にする
      COM_ADOBE_TESTING_S3MOCK_STORE_ROOT: /s3mockroot
      COM_ADOBE_TESTING_S3MOCK_STORE_RETAIN_FILES_ON_EXIT: "true"
    ports:
      - "9090:9090"
    volumes:
      - s3mock-data:/s3mockroot

  # 送信メールの確認用。受信箱は http://localhost:8025、SMTP は localhost:1025
  mailpit:
    image: axllent/mailpit
    ports:
      - "1025:1025"
      - "8025:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 5s
      retries: 10

  # 本番用のバックエンドのイメージ（backend/Dockerfile）を、手元の DB・S3Mock につないで動かす確認用（docs/12）。
  # profile "app" を付けたサービスなので、普段の `docker compose up -d` では起動しない。8080 を使うので、bootRun とは同時に動かせない
  #   docker compose --profile app up -d --build backend
  # 設定は本番と同じ（プロファイルなし。ログは JSON、Swagger UI は無効）で、つなぎ先だけ手元のものにする
  backend:
    build: ./backend
    profiles: ["app"]
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/timeline
      STORAGE_ENDPOINT: http://s3mock:9090
      # ローカル確認専用の値。本番は SSM Parameter Store から渡す
      JWT_SECRET: local-only-jwt-secret-0123456789abcdef
    ports:
      - "8080:8080"
    # Fargate と同じ 1GB に絞り、メモリの設定（MaxRAMPercentage）が効くことも確かめる
    mem_limit: 1g
    depends_on:
      postgres:
        condition: service_healthy
      s3mock:
        condition: service_started

  # パフォーマンステスト（k6）。profile "perf" を付けたサービスなので、普段の `docker compose up -d` では起動しない。
  # ホストで動かしているバックエンド（8080）に負荷をかける。手順は docs/08 の「パフォーマンステスト」
  #   docker compose run --rm k6 run /perf/timeline.ts
  k6:
    image: grafana/k6:2.4.0
    profiles: ["perf"]
    environment:
      BASE_URL: ${BASE_URL:-http://host.docker.internal:8080}
      RESULTS_DIR: /perf/results
      # グラフ付きの HTML レポートを書き出す（k6 の標準機能。実行のたびに上書きする）
      K6_WEB_DASHBOARD: "true"
      K6_WEB_DASHBOARD_EXPORT: /perf/results/report.html
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./perf:/perf

volumes:
  postgres-data:
  s3mock-data:
