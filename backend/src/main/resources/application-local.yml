# ローカル開発用の設定（./gradlew bootRun で有効になる）。本番では使わない
app:
  auth:
    jwt-secret: local-development-secret-do-not-use-in-production

# Swagger UI: http://localhost:8080/swagger-ui.html
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

logging:
  level:
    com.timelinesns: DEBUG
  # 本番の JSON（application.yml）をやめ、人が読みやすいテキストで出す
  structured:
    format:
      console: ""
  # レベルの後ろにリクエスト ID とユーザー ID を付ける（RequestLoggingFilter）
  pattern:
    level: "%5p [%X{requestId:-},%X{userId:-}]"
